services:
  postgres:
    image: postgres:16
    container_name: fundsflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fundsflow
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: fundsflow
    ports:
      - "5432:5432"
    volumes:
      - fundsflow_pgdata:/var/lib/postgresql/data
volumes:
  fundsflow_pgdata:
